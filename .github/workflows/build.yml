name: Spring Boot Build

on:
  push:
    branches:
      - master
      - develop

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Check Java
        run: |
          java -version
          mvn -version

      - name: Check DB configuration
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "DB_URL secret is NOT available"
            exit 1
          fi

          if [ -z "$DB_USERNAME" ]; then
            echo "DB_USERNAME secret is NOT available"
            exit 1
          fi

          if [ -z "$DB_PASSWORD" ]; then
            echo "DB_PASSWORD secret is NOT available"
            exit 1
          fi

          echo "DB_URL is available"
          echo "DB_USERNAME is available"
          echo "DB_PASSWORD is available"

      - name: Build and Test
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mvn clean verify

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: pos-service
          path: target/*.jar
